name: CI
# Every pull request runs this workflow so the final `ci` job always reports.
# Docs-only changes skip the check, build and e2e jobs inside it instead of
# skipping the workflow, which would leave a required check waiting forever.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its running checks.
  # Pushes to main always finish so every merge has a result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An unknown base (a new branch, a rewritten history) counts as code.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^docs/|^\.agents/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - run: pnpm check

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays unchanged package builds; Next reuses its compiler cache.
      - uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build
      # E2E jobs run these built Workers instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            apps/web/.open-next
            apps/site/dist
            apps/jobs/dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor 1/3
            args: --project=editor --shard=1/3
          - name: editor 2/3
            args: --project=editor --shard=2/3
          - name: editor 3/3
            args: --project=editor --shard=3/3
          - name: autosave
            args: --project=autosave
          - name: uploads and auth
            args: --project=uploads --project=auth
          - name: renderer and runtime
            args: --project=renderer --project=runtime
          - name: publication and api
            args: --project=publication --project=api
    name: e2e (${{ matrix.name }})
    env:
      # Hosted runners have two cores: one runtime and browser at a time.
      E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: apps
      - run: pnpm exec playwright test ${{ matrix.args }}
      # Failure screenshots, DOM, JSON reports and the HTML report.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results
            playwright-report

  # The one check to require before merging: it fails if any job above failed
  # or was cancelled, and passes when they passed or were skipped as docs-only.
  ci:
    if: always()
    needs: [changes, check, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
