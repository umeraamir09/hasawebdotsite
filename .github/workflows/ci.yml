name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its running checks.
  # Pushes to main always finish so every merge has a result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Suites run the built workers. Share them instead of rebuilding per job.
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            apps/web/.open-next
            apps/site/dist
            apps/jobs/dist

  suite:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor 1/3
            run: pnpm test:editor --browser-shard=1/3
          - name: editor 2/3
            run: pnpm test:editor --browser-shard=2/3
          - name: editor 3/3
            run: pnpm test:editor --browser-shard=3/3
          - name: autosave
            run: pnpm test:autosave
          - name: uploads
            run: pnpm test:uploads
          - name: draft api and persistence
            run: |
              pnpm test:draft-api
              pnpm test:persistence
          - name: renderer, auth and runtime
            run: |
              pnpm test:renderer
              pnpm test:auth:browser
              pnpm test:runtime
              pnpm test:runtime:smoke
              pnpm spike:routing
    name: suite (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: apps
      - run: ${{ matrix.run }}
        shell: bash -eo pipefail {0}
      # Harnesses write unique evidence directories under .wrangler/evidence,
      # including per-group failure screenshots, DOM and editor state.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ strategy.job-index }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: .wrangler/evidence

  # Required status check. It passes only when every job above passed.
  foundation:
    if: always()
    needs: [check, build, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CI jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
