name: CI
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".agents/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".agents/**"]
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request supersedes its running checks.
  # Pushes to main always finish so every merge has a result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  TURBO_TELEMETRY_DISABLED: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: turbo-check-
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays unchanged package builds; Next reuses its compiler cache.
      - uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build
      # E2E jobs run these built Workers instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            apps/web/.open-next
            apps/site/dist
            apps/jobs/dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor 1/2
            args: --project=editor --shard=1/2
          - name: editor 2/2
            args: --project=editor --shard=2/2
          - name: autosave and api
            args: --project=autosave --project=api
          - name: auth, renderer, publication, runtime
            args: --project=auth --project=renderer --project=publication --project=runtime
    name: e2e (${{ matrix.name }})
    env:
      # Hosted runners have two cores: one runtime and browser at a time.
      E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: apps
      - run: pnpm exec playwright test ${{ matrix.args }}
      # Failure screenshots, DOM, JSON reports and the HTML report.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results
            playwright-report
