name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: RENDERER_EVIDENCE=.wrangler/ci-renderer pnpm test:renderer
      - run: pnpm test:auth:browser --evidence-dir=.wrangler/ci-auth
      - run: pnpm test:persistence
      - run: DRAFT_API_EVIDENCE=.wrangler/ci-draft-api pnpm test:draft-api
      - run: DRAFT_API_EVIDENCE=.wrangler/ci-autosave pnpm test:autosave
      - run: DRAFT_API_EVIDENCE=.wrangler/ci-editor pnpm test:editor
      - run: pnpm test:runtime
      - run: RUNTIME_EVIDENCE=.wrangler/ci-runtime-smoke pnpm test:runtime:smoke
      - run: pnpm spike:routing
